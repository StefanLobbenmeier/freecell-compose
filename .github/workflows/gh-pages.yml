name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stamp service worker version
        env:
          SW_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          sw_version = os.environ.get('SW_VERSION')
          if not sw_version:
              raise SystemExit('SW_VERSION not set')

          sw_path = Path('composeApp/src/webMain/resources/sw.js')
          text = sw_path.read_text(encoding='utf-8')

          import re
          new_text, n = re.subn(r"^const VERSION = '.*';$", f"const VERSION = '{sw_version}';", text, flags=re.M)
          if n != 1:
              raise SystemExit(f'Expected to replace 1 VERSION line, replaced {n}')

          sw_path.write_text(new_text, encoding='utf-8')
          print(f'Stamped {sw_path} VERSION={sw_version}')
          PY

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build (Wasm)
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --console=plain

      - name: Set up Node for browser tests
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install browser tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test production web app
        run: npm run test:web

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Prepare Pages artifact
        if: github.event_name != 'pull_request' && (github.actor != 'renovate[bot]' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || github.ref_name == 'master')
        run: |
          touch composeApp/build/dist/wasmJs/productionExecutable/.nojekyll

      - name: Upload Pages artifact
        id: pages
        if: github.event_name != 'pull_request' && (github.actor != 'renovate[bot]' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: actions/upload-pages-artifact@v5
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    # Finish an active deployment; retain only the newest waiting deployment.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip superseded builds
        id: current
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const { data: head } = await github.rest.repos.getBranch({ owner, repo, branch });
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'gh-pages.yml', branch, per_page: 100,
            });
            const newer = runs.some(run =>
              run.run_number > Number(process.env.GITHUB_RUN_NUMBER) &&
              (run.event === 'push' || run.event === 'workflow_dispatch') &&
              (run.actor.login !== 'renovate[bot]' || run.event === 'workflow_dispatch')
            );
            const current = head.commit.sha === context.sha && !newer;
            core.setOutput('deploy', String(current));
            if (!current) core.notice('Skipping deployment: a newer commit or deployment run exists.');

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
